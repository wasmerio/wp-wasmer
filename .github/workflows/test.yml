name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-npm22-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-npm22-pnpm-store-

    - name: Install dependencies
      working-directory: wasmer/tests
      run: pnpm install

    - name: Run tests
      working-directory: wasmer/tests
      run: pnpm test

  migration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp-version: '6.8.2'
            php-version: '8.3'
            project-suffix: '6-8-2-php8-3'
          - wp-version: '6.7.2'
            php-version: '8.2'
            project-suffix: '6-7-2-php8-2'

    steps:
    - uses: actions/checkout@v4

    - name: Run migration E2E
      env:
        WP_VERSION: ${{ matrix.wp-version }}
        PHP_VERSION: ${{ matrix.php-version }}
        WP_WASMER_E2E_PROJECT: wp-wasmer-migration-e2e-${{ matrix.project-suffix }}
      run: tests/e2e/run-migration-e2e.sh

    - name: Dump Docker logs on failure
      if: failure()
      run: |
        docker compose -p wp-wasmer-migration-e2e-${{ matrix.project-suffix }} -f tests/e2e/docker-compose.yml ps
        docker compose -p wp-wasmer-migration-e2e-${{ matrix.project-suffix }} -f tests/e2e/docker-compose.yml logs --no-color

    - name: Cleanup migration E2E
      if: always()
      run: docker compose -p wp-wasmer-migration-e2e-${{ matrix.project-suffix }} -f tests/e2e/docker-compose.yml down -v --remove-orphans
