name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out released revision
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Install archive build dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: sudo apt-get update && sudo apt-get install --yes rsync zip unzip

      - name: Build plugin archives
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          WP_WASMER_EXPECTED_VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          scripts/build-wasmer.sh
          scripts/build-wasmer-migrate.sh

      - name: Attach plugin archives to GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.zip --clobber
